[build]
  # Публікується ТІЛЬКИ вміст папки public/ — усе інше (README, apps-script.gs,
  # робочі файли) лишається в репозиторії, але не потрапляє на публічний сайт.
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
